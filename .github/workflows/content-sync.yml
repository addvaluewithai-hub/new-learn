name: Content sync
# Writes the imported catalog (content/imported/registry.json) to the database after it
# reaches main. Needs the repository secret CONTENT_DATABASE_URL (admin/direct URL of the
# target Neon branch). Without the secret the job explains and does nothing.
on:
  push:
    branches: [main]
    paths:
      [
        'content/imported/**',
        'apps/platform/content-modules.json',
        'content/book-guided/**',
        'content/availability.json',
        'tools/sync-content.mjs',
        '.github/workflows/content-sync.yml',
      ]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: content-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run content:sync -- --print
      - name: Wait for this commit on Cloudflare Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/wait-pages-deploy.mjs
      - name: Apply to database
        env:
          DATABASE_URL: ${{ secrets.CONTENT_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "CONTENT_DATABASE_URL is not set; nothing was written."
            exit 0
          fi
          npm run content:sync
          node tools/legacy-gas-live-check.mjs
          node --import tsx tools/book-live-check.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: content-live-acceptance
          path: test-results/*-live.json
          if-no-files-found: ignore
