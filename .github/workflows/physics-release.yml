name: Physics 802 live release acceptance
on:
  workflow_run:
    workflows: ['Content sync']
    types: [completed]
permissions:
  contents: read
jobs:
  live:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tools/physics-live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-802-live-acceptance
          path: test-results/physics-802-live.json
          retention-days: 30
          if-no-files-found: warn
