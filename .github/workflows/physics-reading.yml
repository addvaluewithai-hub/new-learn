name: Physics 802 student-host visual acceptance
on:
  pull_request:
    paths:
      - 'content/imported/physics-1-mechanics-waves/**'
      - 'tests/physics-reading-browser.mjs'
      - '.github/workflows/physics-reading.yml'
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/physics-reading-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-802-student-host
          path: test-results/physics-802-launch/
          retention-days: 30
          if-no-files-found: error
