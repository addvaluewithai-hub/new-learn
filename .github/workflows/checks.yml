name: New Learn checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:fixture
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run functions:check
      - run: node --import tsx tests/auth-live.mjs
      - run: npm run sdk:pack
      - run: git diff --exit-code -- distributions/
      - run: npm run sdk:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:book-release
      - run: npm run test:browser:book
      - run: npm run test:browser
      - run: npm run test:browser:chemistry
      - run: npm run test:browser:platform
      - run: npm run test:browser:nova
      - run: npm run test:browser:reading
      - run: npm run test:browser:legacy-gas
      - run: npm run test:browser:statics
      - run: npm run test:browser:talk
      - run: npm run test:browser:flow
      - run: npm run test:browser:handsfree
      - run: npm run test:browser:board
      - run: npm run test:board-check
      - run: for b in fixtures/demos/boards/*/; do npm run board:check -- "$b" || exit 1; done
      - run: npm run test:browser:draft
      - run: npm run test:browser:studio
      - run: npm run test:browser:demos
      - run: npm run test:browser:ui
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: preview-verification
          path: test-results/
          if-no-files-found: ignore
