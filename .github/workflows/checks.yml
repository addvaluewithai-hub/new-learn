name: New Learn checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run prepare:fixture
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run functions:check
      - run: node --import tsx tests/auth-live.mjs
      - run: npm run sdk:pack
      - run: git diff --exit-code -- distributions/
      - run: npm run sdk:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser:chemistry
      - run: npm run test:browser:platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-verification
          path: test-results/
          if-no-files-found: ignore
