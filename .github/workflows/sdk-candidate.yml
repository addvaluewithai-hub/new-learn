name: SDK 0.2.3 candidate package
on:
  pull_request:
    paths:
      - 'packages/lesson-runtime/**'
      - 'apps/platform/package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-candidate.yml'
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run sdk:pack
      - name: Encode public, versioned SDK tarball for exact Git tree upload
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const file='distributions/learn-lesson-runtime-0.2.3.tgz';
            console.log('SDK_TARBALL_BASE64_BEGIN');
            console.log(fs.readFileSync(file).toString('base64'));
            console.log('SDK_TARBALL_BASE64_END');
            console.log('SDK_MANIFEST_BEGIN');
            console.log(fs.readFileSync('distributions/lesson-runtime-0.2.3.json','utf8'));
            console.log('SDK_MANIFEST_END');
          "
